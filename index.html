<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة جامع الكريستال</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #222;
            border: 4px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        .score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="score-board">النقاط: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <!-- شاشة البداية / النهاية -->
        <div id="menu" class="ui-layer">
            <h1 id="menu-title">جامع الكريستال</h1>
            <p id="menu-desc">استخدم سهم اليمين واليسار لتحريك المركبة وتجميع الكريستال وتجنب العقبات!</p>
            <button id="start-btn" onclick="startGame()">ابدأ اللعبة</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const menuEl = document.getElementById("menu");
        const menuTitle = document.getElementById("menu-title");
        const menuDesc = document.getElementById("menu-desc");
        const startBtn = document.getElementById("start-btn");

        let gameInterval;
        let score = 0;
        let isPlaying = false;

        // إعدادات اللاعب (المركبة)
        const player = {
            x: 175,
            y: 530,
            width: 50,
            height: 30,
            speed: 8,
            dx: 0
        };

        let items = [];
        let particles = [];

        // تتبع الأزرار المضغوطة
        let keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.ArrowLeft = true;
            if (e.key === "ArrowRight" || e.key === "d") keys.ArrowRight = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.ArrowLeft = false;
            if (e.key === "ArrowRight" || e.key === "d") keys.ArrowRight = false;
        });

        function startGame() {
            menuEl.classList.add("hidden");
            score = 0;
            scoreEl.textContent = score;
            items = [];
            particles = [];
            player.x = 175;
            isPlaying = true;
            gameInterval = setInterval(update, 1000 / 60); // 60 FPS
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            menuTitle.textContent = "انتهت اللعبة!";
            menuDesc.textContent = `نقاطك النهئية: ${score}`;
            startBtn.textContent = "العب مرة أخرى";
            menuEl.classList.remove("hidden");
        }

        function spawnItem() {
            if (Math.random() < 0.03) {
                const isCrystal = Math.random() > 0.3; // 70% كريستال، 30% عقبة
                items.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    size: isCrystal ? 20 : 25,
                    speed: 3 + Math.random() * 3 + (score * 0.05), // تزداد السرعة مع النقاط
                    type: isCrystal ? 'crystal' : 'obstacle'
                });
            }
        }

        function update() {
            // تحريك اللاعب
            if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
            if (keys.ArrowRight && player.x < canvas.width - player.width) player.x += player.speed;

            // توليد العناصر
            spawnItem();

            // تحديث العناصر
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].y += items[i].speed;

                // التحقق من الاصطدام باللاعب
                if (
                    items[i].x < player.x + player.width &&
                    items[i].x + items[i].size > player.x &&
                    items[i].y < player.y + player.height &&
                    items[i].y + items[i].size > player.y
                ) {
                    if (items[i].type === 'crystal') {
                        score += 10;
                        scoreEl.textContent = score;
                    } else {
                        gameOver();
                        return;
                    }
                    items.splice(i, 1);
                    continue;
                }

                // حذف العناصر التي تجاوزت الشاشة
                if (items[i].y > canvas.height) {
                    items.splice(i, 1);
                }
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم اللاعب
            ctx.fillStyle = "#4CAF50";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#4CAF50";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0; // إعادة تعيين التوهج

            // رسم العناصر (الكريستال والعقبات)
            items.forEach(item => {
                ctx.beginPath();
                if (item.type === 'crystal') {
                    ctx.fillStyle = "#00f7ff";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#00f7ff";
                    ctx.arc(item.x + item.size/2, item.y + item.size/2, item.size/2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#ff3333";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#ff3333";
                    ctx.fillRect(item.x, item.y, item.size, item.size);
                }
                ctx.closePath();
                ctx.shadowBlur = 0;
            });
        }
    </script>
</body>
</html>
